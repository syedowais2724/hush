appId: app.hush.dictation
productName: Hush
copyright: Copyright © 2026 Hush

directories:
  output: release-lite
  buildResources: assets

files:
  - dist/**/*
  - electron/**/*
  - assets/icon.png
  - assets/tray.png
  - package.json
  - node_modules/koffi/**/*
  - node_modules/@koromix/**/*
  - node_modules/uiohook-napi/**/*

asarUnpack:
  - node_modules/@koromix/**/*
  - node_modules/uiohook-napi/**/*

asar: true
npmRebuild: false

extraResources:
  - from: tools/whisper/runtime
    to: whisper
    filter:
      - "whisper-cli.exe"
      - "*.dll"

win:
  target:
    - target: portable
      arch: [x64]
  icon: assets/icon.ico
  artifactName: Hush-${version}-lite.${ext}

portable:
  artifactName: Hush-${version}-lite.${ext}
